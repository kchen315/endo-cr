[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "endo-cr-analysis"
version = "1.1.0"
description = "Analysis-only companion code for clinical–endoscopic complete-response prediction"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy==1.26.4", "pandas==2.0.3", "scipy==1.10.1",
  "scikit-learn==1.3.0", "catboost==1.2.10", "matplotlib==3.10.8"
]

[project.optional-dependencies]
test = ["pytest==9.0.2"]
images = ["torch==2.10.0", "torchvision==0.25.0", "timm==1.0.22", "Pillow==12.0.0"]

[project.scripts]
endo-cr = "endo_cr_analysis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
